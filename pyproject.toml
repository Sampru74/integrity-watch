[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "integrity-watch"
version = "0.1.0"
description = "A local SHA-256 file integrity monitoring CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
integrity-watch = "integrity_watch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
